[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-narrative-collector"
version = "0.1.0"
description = "Budget-limited Pump.fun narrative research collector"
requires-python = ">=3.11"
dependencies = ["websockets>=13,<16"]

[project.scripts]
meme-collector = "narrative_collector.cli:main"
meme-idea-bot = "narrative_collector.idea_bot:main"
meme-idea-telegram = "narrative_collector.telegram_ui:main"

[tool.setuptools.packages.find]
where = ["src"]
